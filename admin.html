<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>CODEX PANEL | V47</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; color: #fff; font-family: 'Space Grotesk', sans-serif; margin: 0; overflow: hidden; }
        
        /* LOGIN */
        .login-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; z-index: 1000; }
        .login-box { border: 1px solid #333; padding: 40px; border-radius: 12px; text-align: center; background: #0a0a0a; }
        .login-input { background: #111; border: 1px solid #333; color: #ccff00; padding: 15px; font-size: 1.2rem; text-align: center; width: 250px; border-radius: 6px; margin-top: 20px; }
        .login-btn { background: #ccff00; color: #000; border: none; padding: 12px 30px; font-weight: bold; cursor: pointer; margin-top: 20px; border-radius: 6px; width: 100%; }
        
        /* LAYOUT: 3 ΣΤΗΛΕΣ (Αριστερά - Κέντρο - Δεξιά) */
        .dashboard-container { 
            display: none; 
            width: 100%;
            height: 100vh;
            padding: 15px;
            box-sizing: border-box;
            grid-template-columns: 450px 1fr 400px;
            gap: 20px;
        }
        
        /* ΣΤΗΛΕΣ */
        .col-left { background: #16141f; border: 1px solid #333; border-radius: 12px; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .col-center { background: #0a0a0a; border: 1px solid #222; border-radius: 12px; padding: 20px; overflow-y: auto; }
        .col-right { display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }

        /* BOXES ΔΕΞΙΑ */
        .tool-box { background: #1a0526; padding: 20px; border-radius: 12px; border: 1px solid #b026ff; }
        .code-box { background: #051a1a; padding: 20px; border-radius: 12px; border: 1px solid #00f0ff; }
        .net-box { background: #111; padding: 20px; border-radius: 12px; border: 1px solid #555; }

        /* FORMS */
        h3 { margin-top: 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        label { font-size: 0.75rem; color: #aaa; text-transform: uppercase; display: block; margin-top: 10px; margin-bottom: 4px; }
        input, select, textarea { background: #080808; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 6px; width: 100%; box-sizing: border-box; font-family: inherit; }
        textarea { height: 70px; resize: vertical; }
        
        /* BUTTONS */
        .btn { border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 6px; margin-top: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .btn-green { background: #ccff00; color: #000; }
        .btn-green:hover { background: #b3e600; }
        .btn-purple { background: #b026ff; color: #fff; }
        .btn-cyan { background: #00f0ff; color: #000; }
        .btn-cancel { background: transparent; border: 1px solid #555; color: #aaa; }

        /* LIST ITEMS */
        .item { display: flex; gap: 10px; align-items: center; background: #181818; padding: 10px; border-radius: 8px; border: 1px solid #333; margin-bottom: 8px; }
        .item img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; background: #000; }
        .item-info { flex: 1; }
        .item-actions { display: flex; gap: 5px; }
        .btn-sm { padding: 5px 10px; font-size: 0.8rem; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .edit-btn { background: #333; color: #fff; }
        .del-btn { background: #330000; color: #ff3333; }

        /* TAGS (FPS/Reviews) */
        .tags-container { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
        .tag { background: #222; border: 1px solid #444; padding: 2px 8px; font-size: 0.75rem; border-radius: 4px; display: flex; align-items: center; gap: 5px; }
        .tag span { cursor: pointer; color: red; font-weight: bold; }
        .add-row { display: flex; gap: 5px; }

        /* TICKETS */
        .ticket { background: #080808; padding: 10px; margin-bottom: 8px; border-left: 3px solid #00f0ff; font-size: 0.85rem; }
        .t-code { font-family: monospace; font-size: 1.1rem; color: #fff; letter-spacing: 1px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-screen" id="login-ui">
        <div class="login-box">
            <h2 style="color:#fff;">CODEX PANEL v47</h2>
            <input type="password" id="admin-pass" class="login-input" placeholder="ACCESS CODE">
            <button class="login-btn" onclick="tryLogin()">INITIALIZE</button>
        </div>
    </div>

    <div class="dashboard-container" id="dashboard-ui">
        
        <div class="col-left">
            <h3 style="color:#ccff00;">SYSTEM CONFIGURATOR</h3>
            
            <div style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label>STATUS (LOCATION)</label>
                    <select id="status">
                        <option value="available">🟢 LIVE (Άμεσα Διαθέσιμο)</option>
                        <option value="coming">🟠 THE VAULT (Προσεχώς)</option>
                        <option value="sold">🔴 SOLD OUT</option>
                    </select>
                </div>
                <div style="flex:1;">
                    <label>CATEGORY</label>
                    <select id="category">
                        <option value="drop">🔥 Live Drop (Main)</option>
                        <option value="gaming">🎮 Starter: Gaming</option>
                        <option value="streaming">🎥 Starter: Streaming</option>
                        <option value="coding">💻 Starter: Coding</option>
                    </select>
                </div>
            </div>

            <label>System Name</label><input type="text" id="name" placeholder="PROJECT X">
            
            <div style="display:flex; gap:10px;">
                <div style="flex:1;"><label>Price (€)</label><input type="text" id="price" placeholder="450"></div>
                <div style="flex:1;"><label>Stock</label><input type="number" id="stock" value="1"></div>
            </div>

            <label>Images (Select Multiple)</label><input type="file" id="imageFiles" multiple>
            <label>Description</label><textarea id="description" placeholder="System details..."></textarea>

            <label style="color:#00f0ff; margin-top:20px;">HARDWARE SPECS</label>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <input type="text" id="cpu" placeholder="CPU (e.g. Ryzen 5)">
                <input type="text" id="gpu" placeholder="GPU (e.g. RTX 3060)">
                <input type="text" id="ram" placeholder="RAM (e.g. 16GB)">
                <input type="text" id="ssd" placeholder="SSD (e.g. 1TB)">
                <input type="text" id="mobo" placeholder="Motherboard">
                <input type="text" id="psu" placeholder="PSU (e.g. 650W)">
            </div>
            <input type="text" id="case" placeholder="CASE Model" style="margin-top:10px;">
            <label>Multitasking (0-100)</label><input type="number" id="multitasking">

            <label style="color:#ccff00;">PERFORMANCE (FPS)</label>
            <div class="add-row">
                <select id="fps-game"><option>Fortnite</option><option>Warzone</option><option>GTA V</option><option>Valorant</option><option>LoL</option></select>
                <input type="number" id="fps-score" placeholder="FPS" style="width:80px;">
                <button class="btn-sm edit-btn" onclick="addFPS()">+</button>
            </div>
            <div id="fps-area" class="tags-container"></div>

            <label style="color:#b026ff;">MANUAL REVIEWS</label>
            <div class="add-row">
                <input type="text" id="rev-user" placeholder="User">
                <input type="number" id="rev-rating" placeholder="5" style="width:50px;">
                <button class="btn-sm edit-btn" onclick="addReview()">+</button>
            </div>
            <input type="text" id="rev-text" placeholder="Review text..." style="margin-top:5px;">
            <div id="review-area" class="tags-container"></div>

            <button id="submit-btn" class="btn btn-green" onclick="handleFormSubmit()">UPLOAD SYSTEM</button>
            <button id="cancel-btn" class="btn btn-cancel" onclick="resetForm()" style="display:none;">CANCEL EDIT</button>
        </div>

        <div class="col-center">
            <h3 style="color:#fff;">INVENTORY</h3>
            <div id="inventory-list">LOADING...</div>
        </div>

        <div class="col-right">
            
            <div class="net-box" style="border-color:#ccff00;">
                <h3 style="color:#ccff00;">TOTAL AGENTS</h3>
                <div id="user-count" style="font-size:2rem; font-weight:bold; color:#fff; text-align:center;">0</div>
            </div>

            <div class="tool-box">
                <h3 style="color:#b026ff;">VOTE EVENT</h3>
                <label>Event Title</label><input type="text" id="v-title" placeholder="Project Ronin">
                <label>Estimated Price (€)</label><input type="text" id="v-price" placeholder="1200">
                <label>Hero Image</label><input type="file" id="v-image">
                <div style="display:flex; gap:10px;">
                    <div><label>Votes Needed</label><input type="number" id="v-target" placeholder="50"></div>
                    <div><label>Duration (Days)</label><input type="number" id="v-days" placeholder="3"></div>
                </div>
                <label>Start Date</label><input type="datetime-local" id="v-start">
                <button class="btn btn-purple" onclick="uploadVote()">START EVENT</button>
            </div>

            <div class="code-box">
                <h3 style="color:#00f0ff;">ORDER CODES</h3>
                <label>Generate for Sold Item:</label>
                <div class="add-row">
                    <select id="sold-pc-select"></select>
                    <button class="btn-sm btn-cyan" onclick="generateCode()">GENERATE</button>
                </div>
                <div id="tickets-list" style="margin-top:15px; max-height:300px; overflow-y:auto;"></div>
            </div>

            <div class="net-box">
                <h3 style="color:#aaa;">THE NETWORK</h3>
                <div id="email-list" style="font-family:monospace; font-size:0.85rem; color:#888;"></div>
            </div>

        </div>

    </div>

<script>
    // ⚠️ ΒΑΛΕ ΤΗΝ IP ΣΟΥ ΕΔΩ (π.χ. 'http://192.168.1.15:5000/api') ΓΙΑ ΚΙΝΗΤΟ Ή ΑΦΗΣΕ LOCALHOST
  const API = 'https://codex-backend-9kij.onrender.com/api';
    
    let TOKEN = null, inventory = [], editId = null;
    let currentImgs = [], currentFPS = [], currentReviews = [], currentVoteImg = "";

    async function tryLogin() {
        const p = document.getElementById('admin-pass').value;
        const res = await fetch(`${API}/login`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:p}) });
        const d = await res.json();
        if(d.success) { 
            TOKEN=p; 
            document.getElementById('login-ui').style.display='none'; 
            document.getElementById('dashboard-ui').style.display='grid'; 
            loadInv(); loadVote(); loadTickets(); loadEmails(); loadUserCount();
        } else alert('WRONG PASSWORD');
    }

    // --- LOAD DATA ---
    async function loadInv() {
        const res = await fetch(`${API}/drops`); inventory = await res.json();
        
        // 1. Fill Inventory List
        document.getElementById('inventory-list').innerHTML = inventory.map(pc => {
            let statusColor = pc.status === 'available' ? '#ccff00' : pc.status === 'coming' ? '#ffaa00' : '#ff3333';
            let statusText = pc.status === 'coming' ? 'THE VAULT' : pc.status === 'available' ? 'LIVE' : 'SOLD OUT';
            
            return `
            <div class="item">
                <img src="${pc.images[0]||''}">
                <div class="item-info">
                    <div style="font-weight:bold; color:#fff;">${pc.name}</div>
                    <div style="font-size:0.8rem; color:#888;">
                        ${pc.category.toUpperCase()} | 
                        <span style="color:${statusColor}; font-weight:bold;">${statusText}</span> | 
                        Stock: ${pc.stock}
                    </div>
                </div>
                <div class="item-actions">
                    <button class="btn-sm edit-btn" onclick="edit('${pc._id}')">EDIT</button>
                    <button class="btn-sm del-btn" onclick="del('${pc._id}')">DEL</button>
                </div>
            </div>`;
        }).join('');

        // 2. Fill Dropdown for Codes
        document.getElementById('sold-pc-select').innerHTML = inventory.map(pc => `<option value="${pc._id}">${pc.name}</option>`).join('');
    }

    async function loadUserCount() {
        try {
            const res = await fetch(`${API}/users/count`, { headers:{'x-admin-auth':TOKEN} });
            const data = await res.json();
            document.getElementById('user-count').innerText = data.count;
        } catch(e) { console.log("User count error", e); }
    }

    // --- FORM LOGIC ---
    function addFPS() { 
        const g=document.getElementById('fps-game').value, s=document.getElementById('fps-score').value; 
        if(s) { currentFPS.push({game:g, score:s}); renderTags(); } 
    }
    function addReview() { 
        const u=document.getElementById('rev-user').value, t=document.getElementById('rev-text').value, r=document.getElementById('rev-rating').value; 
        if(u&&t) { currentReviews.push({user:u, text:t, rating:r, date:new Date()}); renderTags(); } 
    }
    function renderTags() {
        document.getElementById('fps-area').innerHTML = currentFPS.map((f,i) => `<div class="tag">${f.game}:${f.score} <span onclick="currentFPS.splice(${i},1);renderTags()">x</span></div>`).join('');
        document.getElementById('review-area').innerHTML = currentReviews.map((r,i) => `<div class="tag" style="border-color:#b026ff;">${r.user} <span onclick="currentReviews.splice(${i},1);renderTags()">x</span></div>`).join('');
    }

    function edit(id) {
        const pc = inventory.find(i=>i._id===id); if(!pc) return;
        ['name','price','stock','description','multitasking','status','category'].forEach(k => document.getElementById(k).value = pc[k]||'');
        ['cpu','gpu','ram','ssd','mobo','psu','case'].forEach(k => document.getElementById(k).value = pc.specs[k]||'');
        currentFPS = pc.fps || []; currentReviews = pc.reviews || []; renderTags();
        editId = id; currentImgs = pc.images;
        document.getElementById('submit-btn').innerText = "UPDATE SYSTEM";
        document.getElementById('cancel-btn').style.display = 'block';
    }

    function resetForm() {
        editId=null; currentImgs=[]; currentFPS=[]; currentReviews=[]; renderTags();
        document.querySelectorAll('input, textarea').forEach(i=>i.value='');
        document.getElementById('stock').value='1';
        document.getElementById('submit-btn').innerText = "UPLOAD SYSTEM";
        document.getElementById('cancel-btn').style.display = 'none';
    }

    async function handleFormSubmit() {
        const files = document.getElementById('imageFiles').files;
        let imgs = currentImgs;
        if(files.length>0) { 
            const fd = new FormData(); for(let f of files) fd.append('photos', f); 
            const r = await fetch(`${API}/upload`, {method:'POST', headers:{'x-admin-auth':TOKEN}, body:fd}); 
            imgs = (await r.json()).imageUrls; 
        }
        
        const data = {
            name: document.getElementById('name').value, price: document.getElementById('price').value,
            stock: document.getElementById('stock').value, category: document.getElementById('category').value,
            status: document.getElementById('status').value, description: document.getElementById('description').value, 
            multitasking: document.getElementById('multitasking').value, images: imgs,
            specs: { cpu:document.getElementById('cpu').value, gpu:document.getElementById('gpu').value, ram:document.getElementById('ram').value, ssd:document.getElementById('ssd').value, mobo:document.getElementById('mobo').value, psu:document.getElementById('psu').value, case:document.getElementById('case').value },
            fps: currentFPS, reviews: currentReviews
        };

        const url = editId ? `${API}/drops/${editId}` : `${API}/drops`;
        const method = editId ? 'PUT' : 'POST';
        await fetch(url, { method: method, headers:{'Content-Type':'application/json', 'x-admin-auth':TOKEN}, body:JSON.stringify(data) });
        resetForm(); loadInv();
    }

    async function del(id) { if(confirm('Delete?')) { await fetch(`${API}/drops/${id}`, {method:'DELETE', headers:{'x-admin-auth':TOKEN}}); loadInv(); } }

    // --- TOOLS ---
    async function loadVote() { 
        try { 
            const res=await fetch(`${API}/vote-event`); const v=await res.json(); 
            if(v.title) { 
                document.getElementById('v-title').value=v.title; 
                document.getElementById('v-price').value=v.price || ''; 
                document.getElementById('v-target').value=v.targetVotes; 
                document.getElementById('v-days').value=v.durationDays; 
                currentVoteImg=v.image; 
            } 
        } catch(e) {} 
    }
    
    async function uploadVote() {
        const file = document.getElementById('v-image').files[0]; let imgUrl = currentVoteImg;
        if(file) { const fd = new FormData(); fd.append('photos', file); const r = await fetch(`${API}/upload`, {method:'POST', headers:{'x-admin-auth':TOKEN}, body:fd}); imgUrl = (await r.json()).imageUrls[0]; }
        const data = { 
            title: document.getElementById('v-title').value, 
            price: document.getElementById('v-price').value, 
            image: imgUrl, 
            targetVotes: document.getElementById('v-target').value, 
            startDate: document.getElementById('v-start').value, 
            durationDays: document.getElementById('v-days').value 
        };
        await fetch(`${API}/vote-event`, { method: 'POST', headers:{'Content-Type':'application/json', 'x-admin-auth':TOKEN}, body:JSON.stringify(data) }); alert('VOTE LIVE');
    }

    async function loadTickets() {
        const res = await fetch(`${API}/tickets`, { headers:{'x-admin-auth':TOKEN} }); const tickets = await res.json();
        document.getElementById('tickets-list').innerHTML = tickets.map(t => {
            let action = t.status==='pending' ? `<button onclick="activateCode('${t._id}')" class="btn-sm btn-cyan" style="width:100%; margin-top:5px;">DELIVER</button>` : '';
            return `<div class="ticket"><div><span class="t-code">${t.code}</span> <span style="float:right; color:${t.status==='active'?'#ccff00':'orange'}">${t.status}</span></div><div style="color:#888;">${t.pcName}</div>${action}</div>`;
        }).join('');
    }
    async function generateCode() {
        const pcId = document.getElementById('sold-pc-select').value; const pc = inventory.find(p => p._id === pcId);
        await fetch(`${API}/generate-code`, { method: 'POST', headers:{'Content-Type':'application/json', 'x-admin-auth':TOKEN}, body:JSON.stringify({ pcId: pc._id, pcName: pc.name }) }); loadTickets();
    }
    async function activateCode(id) { if(confirm("Confirm?")) { await fetch(`${API}/activate-ticket/${id}`, { method: 'POST', headers:{'x-admin-auth':TOKEN} }); loadTickets(); } }

    async function loadEmails() { 
        const res = await fetch(`${API}/newsletter`, { headers:{'x-admin-auth':TOKEN} }); const emails = await res.json(); 
        document.getElementById('email-list').innerHTML = emails.map(e => `<div style="border-bottom:1px solid #222; padding:5px;">${e.email} <span style="float:right; font-size:0.7rem;">${new Date(e.date).toLocaleDateString()}</span></div>`).join(''); 
    }
</script>
</body>
</html>
